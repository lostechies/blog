name: Scheduled Pages Rebuild

on:
  schedule:
    - cron: '0 12 * * *'  # Daily at noon UTC — publishes future-dated posts when their date arrives
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    uses: ./.github/workflows/deploy.yaml
    permissions:
      contents: read # Clone the repository (required by the reusable workflow's build job)
      pages: write # Deploy to Pages
      id-token: write # Verify the deployment origin
