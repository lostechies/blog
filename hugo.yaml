# Hugo configuration — ported from Jekyll _config.yml (see migration/ for the golden contract)

baseURL: "https://lostechies.com"
locale: "en-us"
title: "Los Techies"
disableKinds: [taxonomy, term, sitemap]

# Posts URL pattern must match the Jekyll permalink /:collection/:year/:month/:day/:title/.
# Every non-post page (author index/archive/tags/about/recentPosts, root pages) carries an
# explicit `url` in front matter, which overrides permalink patterns — so a single
# kind:page pattern covers exactly the posts. :slugorcontentbasename reproduces Jekyll's
# :title (the migration stripped the date prefix from filenames).
permalinks:
- pattern: "/:section/:year/:month/:day/:slugorcontentbasename/"
  target:
    kind: page

# Raw HTML inside old posts must render (Jekyll/kramdown allowed it).
markup:
  goldmark:
    renderer:
      unsafe: true
  # Fenced code blocks: emit Pygments-style classes (as Jekyll/Rouge did) so the
  # existing static/assets/css/highlight.css and the dark-theme rules in custom.css
  # apply, instead of Chroma's inline styles with a hard-coded Monokai background.
  highlight:
    noClasses: false
    guessSyntax: false

# RSS: single site feed at /feed.xml (matches Jekyll feed.xml), no section feeds.
outputFormats:
  rss:
    baseName: "feed"
outputs:
  home: [HTML, RSS]
  page: [HTML]
  section: [HTML]
  taxonomy: [HTML]
  term: [HTML]

